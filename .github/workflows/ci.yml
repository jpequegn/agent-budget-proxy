name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: go build -o abp ./cmd/abp
      - run: python3 examples/api_smoke.py ./abp
      - run: go run ./cmd/abp demo --out data/ci-demo
      - run: go run ./cmd/abp replay --db data/ci-demo/ledger.db
      - run: go run ./cmd/abp experiment --out reports/ci-incident
